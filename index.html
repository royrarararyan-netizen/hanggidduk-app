  <style>
    @import url('https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&family=Nunito:wght@500;700;800&display=swap');
    :root{--ink:#263323;--green:#2e9b60;--mint:#eaf8e9;--cream:#fffaf0;--orange:#ff8a4c;--line:#edf0e9;--sub:#82907e}*{box-sizing:border-box}body{margin:0;background:#e8eee4;color:var(--ink);font-family:'Gowun Dodum',sans-serif;min-height:100vh}button,input{font:inherit}button{cursor:pointer;border:0}.app{width:min(100%,430px);min-height:100vh;margin:auto;background:var(--cream);position:relative;overflow:hidden;padding:22px 20px 100px}.top{display:flex;align-items:center;justify-content:space-between}.brand{font-family:Jua,sans-serif;font-size:25px;letter-spacing:-1px}.brand i{font-style:normal;color:var(--green)}.bell{width:42px;height:42px;border-radius:15px;background:#fff;display:grid;place-items:center;font-size:20px;box-shadow:0 5px 18px #37542b12}.hello{margin:27px 0 17px}.hello small{color:var(--sub);font-weight:700}.hello h1{font-family:Jua,sans-serif;font-size:28px;line-height:1.36;margin:5px 0 0;letter-spacing:-.8px}.search{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);height:59px;border-radius:19px;padding:0 12px 0 17px;box-shadow:0 7px 20px #3342250a}.search span{font-size:21px}.search input{width:100%;border:0;outline:0;color:var(--ink);font-size:14px}.search input::placeholder{color:#a8b0a5}.search button{width:38px;height:38px;border-radius:13px;background:var(--green);color:white;font-size:17px}.chips{display:flex;gap:8px;overflow:auto;padding:16px 0 22px;scrollbar-width:none}.chip{white-space:nowrap;padding:9px 13px;border-radius:12px;background:#fff;color:#71806e;font-size:12px;font-weight:bold}.chip.active{background:#d9f3db;color:#287e4c}.hero{position:relative;min-height:174px;border-radius:25px;background:linear-gradient(120deg,#216f45,#42ad6b);overflow:hidden;padding:20px;color:white;isolation:isolate}.hero:after{content:'';position:absolute;width:210px;height:210px;border:22px solid #8ce0a8;opacity:.2;border-radius:50%;right:-62px;bottom:-115px}.hero .eyebrow{font-size:11px;font-weight:bold;color:#b7e ound:#1e2f2360;align-items:end;justify-content:center}.modal.open{display:flex}.sheet{width:min(100%,430px);max-height:85vh;background:#fffdf9;border-radius:27px 27px 0 0;padding:24px 22px 34px;overflow:auto;animation:up .25s ease}.handle{width:38px;height:4px;border-radius:10px;background:#dce1d9;margin:-10px auto 18px}.sheet h2{font-family:Jua,sans-serif;font-size:25px;margin:0 0 5px}.meta{color:var(--sub);font-size:12px;margin-bottom:20px}.notice{background:#ecf8eb;border-radius:14px;padding:12px 13px;font-size:12px;line-height:1.6;margin-bottom:19px}.steps{counter-reset:step;list-style:none;padding:0;margin:0}.steps li{counter-increment:step;position:relative;padding:0 0 18px 41px;font-size:13px;line-height:1.7}.steps li:before{content:counter(step);position:absolute;left:0;top:0;width:27px;height:27px;border-radius:10px;background:#e3f5e7;color:#21834b;font-family:Nunito,sans-serif;font-weight:800;display:grid;place-items:center}.steps li:not(:last-child):after{content:'';position:absolute;left:13px;top:31px;height:calc(100% - 12px);border-left:1px dashed #cbdccc}.close{float:right;background:#f3f5f0;border-radius:10px;width:32px;height:32px;color:#647061;font-size:17px}@keyframes up{from{transform:translateY(100%)}to{transform:translateY(0)}}
  </style>

  <div class="toast" id="toast"></div>
  <script>
    const r=(n,e,c,t,tags,ing,tip,s)=>({n,e,c,t,tags,ing,tip,s});
    const recipes=[
      r('로제 파스타','🍝','한국식 이탈리아',15,['solo','world'],['파스타','토마토소스','우유','마늘'],'우유가 없다면 두유나 물 2큰술과 마요네즈 1큰술을 섞어 보세요.',['마늘을 약불에서 30초 볶아요.','소스와 우유를 넣고 끓여요.','삶은 면을 넣고 2분간 섞어요.']),
      r('참치마요 덮밥','🍳','한국',10,['quick','solo'],['밥','참치','마요네즈','김'],'참치 기름을 빼면 더 담백해요.',['밥을 그릇에 담아요.','참치와 마요네즈·간장을 섞어요.','김가루와 함께 밥 위에 올려요.']),
      r('김치볶음밥','🍚','한국',10,['quick','solo','spicy'],['밥','김치','계란','고추장'],'김치가 너무 시면 설탕을 반 작은술만 넣어 보세요.',['김치를 2분 볶아요.','밥과 고추장을 넣어요.','고슬고슬해질 때까지 3분 볶아요.']),
      r('전자레인지 계란찜','🥚','한국',6,['quick','microwave'],['계란','물','소금'],'깊은 전자레인지용 그릇을 사용하세요.',['계란과 물·소금을 잘 풀어요.','랩에 구멍을 내고 느슨하게 씌워요.','2분 돌린 뒤 30초씩 추가로 익혀요.']),
      r('된장찌개','🍲','한국',20,['solo'],['된장','두부','감자','양파'],'두부와 애호박은 끓기 시작한 뒤 넣으면 덜 부서져요.',['물에 된장을 잘 풀어요.','감자와 양파를 7분 끓여요.','두부를 넣고 5분 더 끓여요.']),
      r('닭가슴살 비빔밥','🥗','한국',10,['quick','solo','spicy'],['밥','닭가슴살','채소','고추장'],'닭가슴살 대신 참치나 달걀도 좋아요.',['밥 위에 단백질과 채소를 올려요.','고추장과 참기름을 넣어요.','김가루를 뿌리고 비벼요.']),
      r('오야코동','🍚','일본',20,['world','solo'],['밥','닭고기','계란','양파','간장'],'계란은 완전히 익히지 않아도 부드러워요.',['양파와 닭고기를 간장 국물에 익혀요.','푼 계란을 둘러 1분 익혀요.','밥 위에 올려요.']),
      r('야키소바','🍜','일본',15,['world','quick'],['면','양배추','돼지고기','소스'],'센 불에서 빠르게 볶으면 면이 덜 퍼져요.',['고기와 채소를 볶아요.','면과 물 한 숟갈을 넣어요.','소스를 넣고 윤기 나게 볶아요.']),
      r('마파두부','🌶️','중국',20,['world','spicy'],['두부','다진고기','고추장','마늘'],'두부는 마지막에 넣어 살살 섞어 주세요.',['고기와 마늘을 볶아요.','양념과 물을 넣고 끓여요.','두부를 넣어 5분 조려요.']),
      r('토마토 달걀볶음','🍅','중국',12,['world','quick','solo'],['계란','토마토','파','간장'],'토마토는 너무 오래 볶지 않아야 상큼해요.',['계란을 부드럽게 볶아 덜어 둬요.','토마토와 파를 볶아요.','계란을 다시 넣고 간해요.']),
      r('팟타이','🍤','태국',25,['world'],['쌀국수면','새우','계란','숙주','라임'],'라임이나 레몬즙을 마지막에 넣으면 맛이 살아나요.',['면을 불려요.','새우와 계란을 볶아요.','면·소스·숙주를 넣고 볶아요.']),
      r('그린커리','🍛','태국',25,['world','spicy'],['코코넛밀크','커리페이스트','닭고기','채소'],'코코넛밀크가 없다면 우유와 생크림을 섞어도 좋아요.',['커리페이스트를 볶아요.','코코넛밀크와 닭고기를 넣어요.','채소를 넣고 익혀요.']),
      r('반미 샌드위치','🥖','베트남',15,['world','quick'],['바게트','닭고기','오이','당근','고수'],'채소에 식초와 설탕을 살짝 버무리면 더 산뜻해요.',['채소를 가늘게 썰어요.','빵을 바삭하게 데워요.','고기와 채소를 듬뿍 넣어요.']),
      r('분짜','🍜','베트남',25,['world'],['쌀국수면','돼지고기','상추','피시소스'],'소스는 새콤달콤하게, 면은 차갑게 준비해요.',['고기에 양념해 구워요.','면을 삶아 찬물에 헹궈요.','채소와 소스에 곁들여요.']),
      r('버터 치킨 커리','🍛','인도',30,['world','spicy'],['닭고기','토마토','버터','요거트','커리'],'요거트가 닭고기를 부드럽게 해줘요.',['닭고기에 요거트와 향신료를 버무려요.','버터에 토마토소스를 끓여요.','닭고기를 넣고 익혀요.']),
      r('달 렌틸 수프','🥣','인도',25,['world','solo'],['렌틸콩','양파','토마토','커리'],'렌틸콩은 불리지 않아도 비교적 빨리 익어요.',['양파와 향신료를 볶아요.','렌틸콩과 물을 넣어요.','부드러워질 때까지 끓여요.']),
      r('알리오 올리오','🧄','이탈리아',15,['world','quick','solo'],['파스타','마늘','올리브오일','페페론치노'],'면수를 조금 넣으면 소스가 잘 어우러져요.',['면을 삶아요.','마늘과 고추를 약불에 볶아요.','면수와 면을 넣어 섞어요.']),
      r('라따뚜이','🍆','프랑스',35,['world','vegetarian'],['가지','애호박','토마토','양파'],'채소 크기를 비슷하게 썰면 고르게 익어요.',['채소를 썰어요.','양파와 토마토소스를 끓여요.','나머지 채소를 넣고 부드럽게 익혀요.']),
      r('빠에야','🥘','스페인',35,['world'],['쌀','새우','토마토','파프리카'],'중간에 너무 자주 젓지 않으면 바닥이 고소해져요.',['새우와 채소를 볶아요.','쌀과 육수를 넣어요.','뚜껑을 덮고 뜸 들여요.']),
      r('그리스 샐러드','🫒','그리스',10,['world','quick','vegetarian'],['오이','토마토','올리브','치즈'],'소금은 먹기 직전에 넣어 채소의 물이 덜 나와요.',['채소를 큼직하게 썰어요.','올리브와 치즈를 올려요.','올리브오일과 레몬즙을 뿌려요.']),
      r('타코','🌮','멕시코',20,['world','quick','spicy'],['또르띠야','다진고기','토마토','양상추'],'또르띠야는 팬에 20초만 데우면 부드러워요.',['고기에 향신료를 넣고 볶아요.','채소를 잘게 썰어요.','또르띠야에 모두 올려요.']),
      r('칠리 콘 카르네','🫘','멕시코',30,['world','spicy'],['다진고기','콩','토마토','양파'],'콩 통조림은 물에 한 번 헹구면 깔끔해요.',['양파와 고기를 볶아요.','토마토와 콩을 넣어요.','20분간 뭉근히 끓여요.']),
      r('후무스','🫓','중동',10,['world','quick','vegetarian'],['병아리콩','참깨','레몬','마늘'],'병아리콩 통조림으로도 아주 쉽게 만들 수 있어요.',['재료를 믹서에 넣어요.','부드럽게 갈아요.','올리브오일을 뿌려 빵과 곁들여요.']),
      r('샥슈카','🍳','중동',20,['world','spicy','vegetarian'],['계란','토마토','파프리카','양파'],'계란은 노른자가 살짝 흐를 때 가장 맛있어요.',['양파와 파프리카를 볶아요.','토마토소스를 넣고 끓여요.','계란을 넣고 뚜껑을 덮어요.']),
      r('케밥 볼','🥙','터키',25,['world'],['닭고기','요거트','오이','밥'],'요거트에 레몬즙을 넣으면 상큼한 소스가 돼요.',['닭고기에 향신료를 묻혀 구워요.','오이 요거트 소스를 만들어요.','밥과 채소 위에 담아요.']),
      r('타진 스타일 병아리콩 스튜','🫕','모로코',30,['world','vegetarian'],['병아리콩','토마토','당근','감자'],'계피를 아주 조금 넣으면 모로코풍 향이 나요.',['양파와 향신료를 볶아요.','채소·콩·토마토를 넣어요.','부드러워질 때까지 끓여요.']),
      r('보르시','🥣','우크라이나',40,['world','vegetarian'],['비트','양배추','감자','양파'],'요거트나 사워크림을 곁들이면 부드러워요.',['채소를 채 썰어요.','양파와 비트를 볶아요.','육수와 나머지 채소를 넣고 끓여요.']),
      r('굴라시','🍲','헝가리',45,['world'],['소고기','파프리카','감자','양파'],'약불에서 오래 끓이면 고기가 더 부드러워져요.',['고기와 양파를 볶아요.','파프리카가루와 토마토를 넣어요.','감자와 물을 넣고 푹 끓여요.']),
      r('피시 앤드 칩스','🐟','영국',30,['world'],['흰살생선','감자','밀가루','레몬'],'감자는 물기를 완전히 닦아야 바삭해져요.',['감자를 구워요.','생선에 반죽을 입혀 구워요.','레몬과 함께 내요.']),
      r('치킨 퀘사디야','🧀','미국',15,['world','quick'],['또르띠야','닭고기','치즈','파프리카'],'치즈가 녹을 때까지만 구우면 또르띠야가 바삭해요.',['닭고기와 채소를 볶아요.','또르띠야에 치즈와 속을 올려요.','반으로 접어 앞뒤로 구워요.']),
      r('브라질식 빈 스튜','🫘','브라질',35,['world'],['검은콩','소시지','양파','마늘'],'검은콩 통조림을 쓰면 시간을 많이 줄일 수 있어요.',['양파와 소시지를 볶아요.','콩과 물을 넣어요.','걸쭉해질 때까지 끓여요.'])
    ];
    const $=s=>document.querySelector(s), modal=$('#modal'), toast=$('#toast');
    const saved=JSON.parse(localStorage.getItem('hanggiSaved')||'[]');
    let current=null,currentFilter='all';

    const say=m=>{toast.textContent=m;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),2200)};
    const activate=tag=>document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('active',x.dataset.filter===tag));
    const cards=list=>{
      $('#recipeCards').innerHTML=list.map(x=>`<article class="card" data-name="${x.n}"><div class="food" style="--foodbg:#f9e5c8">${x.e}</div><p>${x.n}</p><small>${x.c} · ${x.t}분</small></article>`).join('');
      document.querySelectorAll('.card').forEach(x=>x.onclick=()=>openRecipe(x.dataset.name));
    };
    const showList=(list,heading,notice)=>{
      $('#menuHeading').textContent=heading;
      $('#more').textContent='전체 보기';
      cards(list);
      if(notice) say(notice);
    };
    function openRecipe(name){
      current=recipes.find(x=>x.n===name);
      if(!current)return;
      $('#recipeTitle').textContent=current.n;
      $('#recipeMeta').textContent=`${current.c} · ⏱ ${current.t}분 · 🍳 난이도 쉬움 · 1인분`;
      $('#recipeTip').innerHTML=`💡 <b>필요한 재료</b> ${current.ing.join(' · ')}<br><br>${current.tip}`;
      $('#recipeSteps').innerHTML=current.s.map(x=>`<li>${x}</li>`).join('');
      $('#saveRecipe').textContent=saved.includes(current.n)?'♥ 저장됨':'♡ 저장하기';
      modal.classList.add('open');
    }
    function filter(tag){
      currentFilter=tag;
      const labels={all:'모든 레시피',world:'세계 요리',quick:'10분 완성',solo:'자취생 필수',microwave:'전자레인지',spicy:'매콤한'};
      const list=tag==='all'?recipes:recipes.filter(x=>x.tags.includes(tag));
      activate(tag); showList(list,labels[tag]||'레시피',`${list.length}개의 레시피를 보고 있어요.`);
    }
    function search(query){
      const q=query.trim().toLowerCase().replaceAll(' ','');
      if(!q){filter('all');return}
      const list=recipes.filter(x=>[x.n,x.c,...x.ing].join('').toLowerCase().replaceAll(' ','').includes(q));
      showList(list,`“${query.trim()}” 검색 결과`,list.length?`${list.length}개의 레시피를 찾았어요.`:'일치하는 레시피가 없어요. 재료명·나라·요리명을 다시 검색해 보세요.');
    }
    function pantry(){
      const value=window.prompt('냉장고에 있는 재료를 쉼표로 입력해 주세요.\n예: 계란, 토마토, 밥');
      if(value===null)return;
      const terms=value.split(',').map(x=>x.trim()).filter(Boolean);
      if(!terms.length){say('재료를 하나 이상 입력해 주세요.');return}
      const list=recipes.map(x=>({...x,score:terms.filter(t=>x.ing.some(i=>i.includes(t)||t.includes(i))).length})).filter(x=>x.score).sort((a,b)=>b.score-a.score);
      showList(list,'냉장고 맞춤 레시피',list.length?`${terms.join(', ')}으로 ${list.length}개를 찾았어요.`:'딱 맞는 재료 조합은 없어요. 모든 레시피에서 찾아보세요.');
    }
    $('#recipeForm').onsubmit=e=>{e.preventDefault();search($('#recipeInput').value)};
    document.querySelectorAll('.chip').forEach(x=>x.onclick=()=>filter(x.dataset.filter));
    $('#more').onclick=()=>filter('all');
    $('#saveRecipe').onclick=()=>{
      if(!current)return;
      const i=saved.indexOf(current.n);
      i<0?saved.push(current.n):saved.splice(i,1);
      localStorage.setItem('hanggiSaved',JSON.stringify(saved));
      $('#saveRecipe').textContent=saved.includes(current.n)?'♥ 저장됨':'♡ 저장하기';
      say(saved.includes(current.n)?'저장했어요!':'저장을 취소했어요.');
    };
    $('#close').onclick=()=>modal.classList.remove('open');
    modal.onclick=e=>{if(e.target===modal)modal.classList.remove('open')};
    $('#bell').onclick=()=>say('오늘은 냉장고 재료로 새로운 한 끼를 찾아볼까요?');
    document.querySelectorAll('.quick-item').forEach(x=>x.onclick=()=>x.dataset.help==='fridge'?pantry():showList(recipes.filter(r=>r.tags.includes('quick')||r.tags.includes('solo')),'요리 기초 추천','10~20분 레시피부터 차근차근 시작해 보세요.'));
    document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{
      document.querySelector('.nav .active').classList.remove('active');b.classList.add('active');
      if(b.dataset.nav==='recipes'){filter('all');window.scrollTo({top:330,behavior:'smooth'})}
      else if(b.dataset.nav==='saved'){const list=recipes.filter(x=>saved.includes(x.n));showList(list,'저장한 레시피',list.length?`${list.length}개를 저장했어요.`:'저장한 레시피가 없어요. 마음에 드는 레시피에서 ♡ 저장하기를 눌러 보세요.')}
      else if(b.dataset.nav==='my'){const list=recipes.filter(x=>saved.includes(x.n));showList(list,'나의 주방',list.length?`저장한 ${list.length}개 레시피를 언제든 다시 만들 수 있어요.`:'아직 저장한 레시피가 없어요. 모든 레시피를 둘러보고 나만의 메뉴를 모아 보세요.')}
      else{filter('all');window.scrollTo({top:0,behavior:'smooth'})}
    });
    document.querySelectorAll('[data-recipe]').forEach(x=>x.onclick=()=>openRecipe(x.dataset.recipe));
    filter('all');
  </script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(() => {}));
}
</script>
</body>
</html>
