<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>한끼뚝딱 · 요알못 레시피</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&family=Nunito:wght@500;700;800&display=swap');
    :root{--ink:#263323;--green:#2e9b60;--mint:#eaf8e9;--cream:#fffaf0;--orange:#ff8a4c;--line:#edf0e9;--sub:#82907e}*{box-sizing:border-box}body{margin:0;background:#e8eee4;color:var(--ink);font-family:'Gowun Dodum',sans-serif;min-height:100vh}button,input{font:inherit}button{cursor:pointer;border:0}.app{width:min(100%,430px);min-height:100vh;margin:auto;background:var(--cream);position:relative;overflow:hidden;padding:22px 20px 100px}.top{display:flex;align-items:center;justify-content:space-between}.brand{font-family:Jua,sans-serif;font-size:25px;letter-spacing:-1px}.brand i{font-style:normal;color:var(--green)}.bell{width:42px;height:42px;border-radius:15px;background:#fff;display:grid;place-items:center;font-size:20px;box-shadow:0 5px 18px #37542b12}.hello{margin:27px 0 17px}.hello small{color:var(--sub);font-weight:700}.hello h1{font-family:Jua,sans-serif;font-size:28px;line-height:1.36;margin:5px 0 0;letter-spacing:-.8px}.search{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);height:59px;border-radius:19px;padding:0 12px 0 17px;box-shadow:0 7px 20px #3342250a}.search span{font-size:21px}.search input{width:100%;border:0;outline:0;color:var(--ink);font-size:14px}.search input::placeholder{color:#a8b0a5}.search button{width:38px;height:38px;border-radius:13px;background:var(--green);color:white;font-size:17px}.chips{display:flex;gap:8px;overflow:auto;padding:16px 0 22px;scrollbar-width:none}.chip{white-space:nowrap;padding:9px 13px;border-radius:12px;background:#fff;color:#71806e;font-size:12px;font-weight:bold}.chip.active{background:#d9f3db;color:#287e4c}.hero{position:relative;min-height:174px;border-radius:25px;background:linear-gradient(120deg,#216f45,#42ad6b);overflow:hidden;padding:20px;color:white;isolation:isolate}.hero:after{content:'';position:absolute;width:210px;height:210px;border:22px solid #8ce0a8;opacity:.2;border-radius:50%;right:-62px;bottom:-115px}.hero .eyebrow{font-size:11px;font-weight:bold;color:#b7edc3}.hero h2{font-family:Jua,sans-serif;font-size:23px;line-height:1.35;letter-spacing:-.6px;margin:7px 0 14px}.hero button{position:relative;z-index:2;background:#fff;color:#267c4a;border-radius:12px;padding:9px 13px;font-weight:bold;font-size:12px}.mascot{position:absolute;right:15px;top:15px;width:128px;z-index:1}.section-head{display:flex;justify-content:space-between;align-items:center;margin:27px 1px 13px}.section-head h3{font-family:Jua,sans-serif;font-size:20px;margin:0;letter-spacing:-.4px}.section-head button{background:transparent;color:#8b9788;font-size:12px;font-weight:bold}.cards{display:flex;gap:12px;overflow:auto;margin-right:-20px;padding-right:20px;scrollbar-width:none}.card{flex:0 0 154px;background:#fff;border:1px solid #f0f1ec;border-radius:18px;overflow:hidden;box-shadow:0 7px 18px #36512009}.food{height:103px;display:grid;place-items:center;font-size:50px;background:var(--foodbg,#f9e7c8)}.card p{margin:10px 11px 2px;font-weight:bold;font-size:13px;letter-spacing:-.5px}.card small{display:block;margin:0 11px 11px;color:#8d998b;font-size:10px}.quick{display:grid;grid-template-columns:1fr 1fr;gap:11px}.quick-item{border-radius:17px;padding:15px;min-height:105px;position:relative;overflow:hidden}.quick-item:nth-child(1){background:#fff0e6}.quick-item:nth-child(2){background:#e9f7ee}.quick-item b{font-size:14px}.quick-item p{font-size:11px;line-height:1.5;color:#737e70;margin:5px 0}.quick-item span{position:absolute;right:12px;bottom:11px;font-size:27px}.nav{position:fixed;z-index:3;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,430px);height:75px;background:#fffdfaef;border-top:1px solid #edf0e9;backdrop-filter:blur(10px);display:flex;justify-content:space-around;padding-top:12px}.nav button{background:transparent;color:#9da79a;font-size:10px;display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:bold}.nav button span{font-size:20px;line-height:20px}.nav button.active{color:var(--green)}.modal{display:none;position:fixed;z-index:8;inset:0;background:#1e2f2360;align-items:end;justify-content:center}.modal.open{display:flex}.sheet{width:min(100%,430px);max-height:85vh;background:#fffdf9;border-radius:27px 27px 0 0;padding:24px 22px 34px;overflow:auto;animation:up .25s ease}.handle{width:38px;height:4px;border-radius:10px;background:#dce1d9;margin:-10px auto 18px}.sheet h2{font-family:Jua,sans-serif;font-size:25px;margin:0 0 5px}.meta{color:var(--sub);font-size:12px;margin-bottom:20px}.notice{background:#ecf8eb;border-radius:14px;padding:12px 13px;font-size:12px;line-height:1.6;margin-bottom:19px}.steps{counter-reset:step;list-style:none;padding:0;margin:0}.steps li{counter-increment:step;position:relative;padding:0 0 18px 41px;font-size:13px;line-height:1.7}.steps li:before{content:counter(step);position:absolute;left:0;top:0;width:27px;height:27px;border-radius:10px;background:#e3f5e7;color:#21834b;font-family:Nunito,sans-serif;font-weight:800;display:grid;place-items:center}.steps li:not(:last-child):after{content:'';position:absolute;left:13px;top:31px;height:calc(100% - 12px);border-left:1px dashed #cbdccc}.close{float:right;background:#f3f5f0;border-radius:10px;width:32px;height:32px;color:#647061;font-size:17px}@keyframes up{from{transform:translateY(100%)}to{transform:translateY(0)}}
  </style>
  <style>.toast{position:fixed;z-index:10;bottom:93px;left:50%;transform:translate(-50%,20px);background:#263323;color:#fff;border-radius:13px;padding:11px 15px;white-space:nowrap;font-size:12px;opacity:0;pointer-events:none;transition:.25s}.toast.show{opacity:1;transform:translate(-50%,0)}.card,.quick-item{cursor:pointer}</style>
<link rel="manifest" href="manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icon.svg">
<style>button,.card,.quick-item{min-height:44px}.nav button{min-width:44px}</style>
</head>
<body>
  <main class="app">
    <header class="top"><div class="brand">한끼<i>뚝딱</i></div><button class="bell" id="bell" aria-label="알림">🔔</button></header>
    <section class="hello"><small>오늘도 잘 챙겨 먹어요, 민지님 👋</small><h1>냉장고 재료로<br>무엇을 만들어 볼까요?</h1></section>
    <form class="search" id="recipeForm"><span>⌕</span><input id="recipeInput" placeholder="먹고 싶은 요리를 입력해 주세요" autocomplete="off"><button aria-label="검색">→</button></form>
    <div class="chips"><button class="chip active" data-filter="quick"># 10분 완성</button><button class="chip" data-filter="solo"># 자취생 필수</button><button class="chip" data-filter="microwave"># 전자레인지</button><button class="chip" data-filter="spicy"># 매콤한</button></div>
    <section class="hero"><div class="eyebrow">요알못도 성공하는 오늘의 추천</div><h2>한 팬으로 끝내는<br>꾸덕한 로제 파스타</h2><button data-recipe="로제 파스타">레시피 보기 →</button>
      <svg class="mascot" viewBox="0 0 150 150" aria-label="브로 마스코트" role="img"><ellipse cx="75" cy="133" rx="46" ry="7" fill="#155536" opacity=".22"/><path d="M62 50C52 28 72 17 75 39C83 14 103 27 88 50" fill="#e9ffdf" stroke="#1a623c" stroke-width="5" stroke-linejoin="round"/><path d="M75 47C40 44 30 71 43 103c9 22 55 27 69 0 14-30 0-57-37-56Z" fill="#78c966" stroke="#1a623c" stroke-width="5"/><ellipse cx="60" cy="76" rx="5" ry="7" fill="#263323"/><ellipse cx="88" cy="76" rx="5" ry="7" fill="#263323"/><path d="M64 91c8 8 16 8 24 0" fill="none" stroke="#263323" stroke-width="4" stroke-linecap="round"/><path d="M48 100c13 9 40 9 54 0l-2 22c-16 8-32 8-49 0Z" fill="#fff5df" stroke="#1a623c" stroke-width="4"/><path d="M112 86c17-11 21 9 7 18" fill="none" stroke="#1a623c" stroke-width="7" stroke-linecap="round"/><circle cx="119" cy="99" r="4" fill="#ff9d65"/></svg>
    </section>
    <div class="section-head"><h3 id="menuHeading">지금 많이 찾는 메뉴</h3><button id="more">더보기 ›</button></div>
    <section class="cards" id="recipeCards"></section>
    <div class="section-head"><h3>처음이라면 여기부터</h3></div>
    <section class="quick"><article class="quick-item" data-help="fridge"><b>냉장고 파먹기</b><p>남은 재료를 입력하면<br>딱 맞는 메뉴를 찾아드려요.</p><span>🥬</span></article><article class="quick-item" data-help="basic"><b>요리 기초 사전</b><p>썰기부터 불 조절까지<br>사진처럼 쉽게 배워요.</p><span>👩‍🍳</span></article></section>
  </main>
  <nav class="nav"><button class="active" data-nav="home"><span>⌂</span>홈</button><button data-nav="recipes"><span>◫</span>레시피</button><button data-nav="saved"><span>♡</span>저장</button><button data-nav="my"><span>☻</span>마이</button></nav>
  <div class="modal" id="modal"><section class="sheet"><button class="close" id="close">×</button><div class="handle"></div><h2 id="recipeTitle">로제 파스타</h2><div class="meta" id="recipeMeta">⏱ 15분 · 🍳 난이도 쉬움 · 1인분</div><div class="notice" id="recipeTip"></div><ol class="steps" id="recipeSteps"></ol><button id="saveRecipe" style="width:100%;background:#2e9b60">♡ 저장하기</button></section></div>
  <div class="toast" id="toast"></div>
  <script>
    const recipes=[
      {n:'로제 파스타',e:'🍝',t:15,tags:['solo'],tip:'우유가 없다면 두유나 물 2큰술과 마요네즈 1큰술로 부드러운 맛을 낼 수 있어요.',s:['팬에 기름과 다진 마늘을 약불에서 30초 볶아요.','토마토소스 4큰술, 우유 반 컵, 물 반 컵을 넣고 끓여요.','삶은 면을 넣고 2분간 섞어요. 치즈가 있다면 마지막에 넣어요.']},
      {n:'참치마요 덮밥',e:'🍳',t:10,tags:['quick','solo'],tip:'참치 기름을 꼭 빼면 덜 느끼하고 더 맛있어요.',s:['따뜻한 밥을 그릇에 담아요.','참치 반 캔에 마요네즈 1큰술과 간장 1작은술을 섞어요.','밥 위에 참치마요와 김가루를 올려요.']},
      {n:'토마토 파스타',e:'🍅',t:15,tags:['solo'],tip:'면수는 소스를 면에 착 붙게 해주는 비밀 재료예요.',s:['면을 포장지 시간보다 1분 덜 삶아요.','팬에 마늘과 토마토소스 반 컵을 넣고 끓여요.','면과 면수 3큰술을 넣고 1분간 섞어요.']},
      {n:'초간단 라면',e:'🍜',t:8,tags:['quick','solo','spicy'],tip:'계란은 마지막 1분에 넣으면 노른자가 촉촉해요.',s:['냄비에 물 500ml를 팔팔 끓여요.','면과 스프를 넣고 면을 살살 풀어요.','3분 30초 뒤 불을 끄고 취향 재료를 올려요.']},
      {n:'김치볶음밥',e:'🍚',t:10,tags:['quick','solo','spicy'],tip:'김치가 너무 시면 설탕을 반 작은술만 넣어 보세요.',s:['김치를 가위로 잘게 잘라 기름에 2분 볶아요.','밥 한 공기와 고추장을 반 작은술 넣어요.','밥알이 고슬고슬해질 때까지 3분 볶고 김가루를 뿌려요.']},
      {n:'계란볶음밥',e:'🥚',t:10,tags:['quick','solo'],tip:'찬밥을 쓰면 밥알이 더 고슬고슬해져요.',s:['계란 2개를 풀어 기름 두른 팬에 스크램블해요.','밥과 간장 1작은술을 넣어요.','파나 김가루를 넣고 2분 더 볶아요.']},
      {n:'전자레인지 계란찜',e:'🥚',t:6,tags:['quick','microwave'],tip:'그릇은 깊은 전자레인지용 그릇을 사용해요.',s:['계란 2개와 물 반 컵, 소금 한 꼬집을 잘 풀어요.','랩을 느슨하게 씌우고 젓가락으로 구멍을 내요.','전자레인지에 2분 돌린 뒤 30초씩 추가로 익혀요.']},
      {n:'콘치즈',e:'🧀',t:7,tags:['quick','microwave'],tip:'마요네즈가 없다면 우유 한 숟갈과 치즈를 조금 더 넣어요.',s:['옥수수 한 캔의 물기를 빼요.','옥수수, 마요네즈 1큰술, 치즈를 그릇에 담아요.','전자레인지에 1분 30초 돌려 치즈를 녹여요.']},
      {n:'된장찌개',e:'🍲',t:20,tags:['solo'],tip:'두부와 애호박은 끓기 시작한 뒤 넣으면 부서지지 않아요.',s:['물 2컵에 된장 1큰술을 잘 풀어요.','감자나 양파가 있다면 먼저 넣고 7분 끓여요.','두부와 애호박을 넣고 5분 더 끓여요.']},
      {n:'순두부찌개',e:'🌶️',t:15,tags:['solo','spicy'],tip:'고춧가루는 기름에 10초만 볶아야 타지 않아요.',s:['기름에 고춧가루 1큰술과 다진 마늘을 10초 볶아요.','물 1컵과 순두부를 넣고 끓여요.','간장으로 간을 맞추고 달걀을 하나 올려요.']},
      {n:'감자채볶음',e:'🥔',t:12,tags:['solo'],tip:'감자를 물에 3분 담가 전분을 빼면 덜 달라붙어요.',s:['감자를 가늘게 채 썰고 물에 헹궈요.','기름 두른 팬에 감자를 넣고 중불에서 볶아요.','소금 한 꼬집으로 간하고 투명해지면 불을 꺼요.']},
      {n:'닭가슴살 비빔밥',e:'🥗',t:10,tags:['quick','solo','spicy'],tip:'닭가슴살 대신 참치나 달걀을 써도 좋아요.',s:['밥 위에 닭가슴살과 있는 채소를 올려요.','고추장 1큰술, 참기름 반 큰술을 넣어요.','김가루를 뿌리고 골고루 비벼 먹어요.']}
    ];
    const $=s=>document.querySelector(s), modal=$('#modal'), toast=$('#toast'), saved=JSON.parse(localStorage.getItem('hanggiSaved')||'[]'); let current=null,showAll=false;
    const say=m=>{toast.textContent=m;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1800)};
    const cards=list=>{$('#recipeCards').innerHTML=list.map(r=>`<article class="card" data-name="${r.n}"><div class="food" style="--foodbg:#f9e5c8">${r.e}</div><p>${r.n}</p><small>${r.t}분 · 재료 ${r.s.length+2}개</small></article>`).join('');document.querySelectorAll('.card').forEach(c=>c.onclick=()=>openRecipe(c.dataset.name))};
    function openRecipe(name){current=recipes.find(r=>r.n===name);if(!current)return say('찾은 메뉴가 없어요. 재료나 메뉴명을 다시 입력해 주세요.');$('#recipeTitle').textContent=current.n;$('#recipeMeta').textContent=`⏱ ${current.t}분 · 🍳 난이도 쉬움 · 1인분`;$('#recipeTip').innerHTML=`💡 <b>브로의 팁!</b> ${current.tip}`;$('#recipeSteps').innerHTML=current.s.map(x=>`<li>${x}</li>`).join('');$('#saveRecipe').textContent=saved.includes(current.n)?'♥ 저장됨':'♡ 저장하기';modal.classList.add('open')}
    function filter(tag){showAll=false;const list=tag==='all'?recipes:recipes.filter(r=>r.tags.includes(tag));$('#menuHeading').textContent=tag==='all'?'전체 레시피':tag==='quick'?'10분 안에 완성':'추천 레시피';cards(list);say(`${list.length}개의 레시피를 찾았어요.`)}
    $('#recipeForm').onsubmit=e=>{e.preventDefault();const q=$('#recipeInput').value.trim().replaceAll(' ','');if(!q)return say('먹고 싶은 메뉴를 입력해 주세요.');const found=recipes.find(r=>r.n.replaceAll(' ','').includes(q)||q.includes(r.n.replaceAll(' ','')));found?openRecipe(found.n):say('아직 그 메뉴는 준비 중이에요. 김치볶음밥, 된장찌개처럼 검색해 보세요!')};
    document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{document.querySelector('.chip.active').classList.remove('active');c.classList.add('active');filter(c.dataset.filter)});
    $('#more').onclick=()=>{showAll=!showAll;$('#more').textContent=showAll?'접기 ↑':'더보기 ›';filter(showAll?'all':document.querySelector('.chip.active').dataset.filter)};
    $('#saveRecipe').onclick=()=>{if(!current)return;const i=saved.indexOf(current.n);i<0?saved.push(current.n):saved.splice(i,1);localStorage.setItem('hanggiSaved',JSON.stringify(saved));$('#saveRecipe').textContent=saved.includes(current.n)?'♥ 저장됨':'♡ 저장하기';say(saved.includes(current.n)?'저장했어요!':'저장을 취소했어요.')};
    $('#close').onclick=()=>modal.classList.remove('open');modal.onclick=e=>{if(e.target===modal)modal.classList.remove('open')};$('#bell').onclick=()=>say('브로가 오늘의 메뉴를 준비했어요!');
    document.querySelectorAll('.quick-item').forEach(x=>x.onclick=()=>say(x.dataset.help==='fridge'?'밥·김치·계란·참치만 있어도 맛있는 한 끼가 가능해요!':'불은 약불부터 시작하고, 간은 마지막에 조금씩 맞춰 보세요.'));
    document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{document.querySelector('.nav .active').classList.remove('active');b.classList.add('active');if(b.dataset.nav==='recipes'){filter('all');window.scrollTo({top:330,behavior:'smooth'})}else if(b.dataset.nav==='saved'){const list=recipes.filter(r=>saved.includes(r.n));$('#menuHeading').textContent='저장한 레시피';cards(list);say(list.length?`${list.length}개를 저장했어요.`:'아직 저장한 레시피가 없어요.');}else if(b.dataset.nav==='my')say('내 냉장고 기능은 곧 추가될 예정이에요!');else{filter('quick');window.scrollTo({top:0,behavior:'smooth'})}});
    document.querySelectorAll('[data-recipe]').forEach(b=>b.onclick=()=>openRecipe(b.dataset.recipe));filter('quick');
  </script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(() => {}));
}
</script>
</body>
</html>
